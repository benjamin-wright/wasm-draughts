name: wasm-draughts
path-prefix: /games/draughts
sql:
  enabled: true
dependencies:
  serde: {version: "1.0", features: ["derive"]}
  serde_urlencoded: "0.7"
  askama: {version: "0.16", default-features: false, features: [derive, alloc, config]}

publish:
  registry: "docker.io/benwright"
  version: "0.1.0"

functions:
  greet:
    http:
      method: GET
      path: /
  play:
    http:
      method: POST
      path: /play
